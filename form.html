      function formatDateFromString(text) {
        const dt = new Date(text);
        if (!isNaN(dt)) {
          const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
          const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
          return `${day} ${dt.getDate()} ${mo} ${dt.getFullYear()}`;
        }
        const m = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (m) {
          const d = new Date(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`);
          if (!isNaN(d)) {
            const day = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
            const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
            return `${day} ${d.getDate()} ${mo} ${d.getFullYear()}`;
          }
        }
        return text;
      }

    function formatNumber(num) {
        const clean = String(num).replace(/,/g, '');
        return Number(clean).toLocaleString('en-US');
    }

        }

        }

        } else {

      document.addEventListener('DOMContentLoaded', function() {
        const input = document.getElementById('comfirmInput');
        const output = document.getElementById('comfirmOutput');
        const button = document.getElementById('comfirmParse');
        button.addEventListener('click', function() {
          if (!input.value) {
            output.textContent = 'กรุณาวางข้อความในช่องก่อน';
            return;
          }
          output.textContent = parseConfirmInput((input.value).trim());
        });

        document.getElementById('comfirmCopy').addEventListener('click', async () => {
            const text = document.getElementById('comfirmOutput').textContent;
            const status = document.getElementById('status');

            try {
                await navigator.clipboard.writeText(text);
                status.textContent = 'Copied!';
                
                setTimeout(() => status.textContent = '', 1500);
            } catch (err) {
                status.textContent = 'Failed to copy';
            }
        });

        document.getElementById('generateFeeForm').addEventListener('click', () => {
            const priceFee = Number(document.getElementById("priceFee").value) || 0;
            const webFee = Number(document.getElementById("webFee").value) || 0;
            const ticketFee = Number(document.getElementById("ticketFee").value) || 0;
            const shippingFee = Number(document.getElementById("shippingFee").value) || 0;

            const qty = Number(document.getElementById("ticketQty").value) || 1;
            const paid = Number(document.getElementById("paidAmount").value) || 0;

            let parts = [];
            let labels = [];

            if (priceFee > 0) {
                parts.push(priceFee);
                labels.push("ค่ากดบัตร");
            }
            if (webFee > 0) {
                parts.push(webFee);
                labels.push("ค่าธรรมเนียมจากเว็บ");
            }
            if (ticketFee > 0) {
                parts.push({ price: ticketFee, qty: qty });
                labels.push("ค่าบัตร");
            }
            if (shippingFee > 0) {
                parts.push(shippingFee);
                labels.push("ค่าส่งบัตร");
            }

            // รวมยอด
            let total = 0;
            let displayParts = [];

            parts.forEach(p => {
                if (typeof p === "number") {
                    total += p;
                    displayParts.push(formatNumber(p));
                } else {
                    const subtotal = p.price * p.qty;
                    total += subtotal;
                    displayParts.push(`(${formatNumber(p.price)} × ${p.qty})`);
                }
            });

            // label
            let labelText = "";
            if (labels.length === 1) {
                labelText = labels[0];
            } else if (labels.length > 1) {
                labelText = labels.join(", ").replace(/, ([^,]*)$/, " และ$1");
            }

            let text = "";

            // 🔥 กรณีมีเงินโอน → สรุปแบบเต็ม
            if (paid > 0) {
                const refund = paid - total;

                text = `ขออนุญาตสรุปยอด${labelText}นะคะ\n💳 ยอดชำระ: ${displayParts.join(" + ")} = ${formatNumber(total)} บาท\n💰 ลูกค้าโอนล่วงหน้า: ${formatNumber(paid)} บาท`;

                if (refund > 0) {
                text += `\n🔁 คืนเงินส่วนต่าง: ${formatNumber(refund)} บาท\nรบกวนแจ้งเลขที่บัญชีเพื่อโอนเงินคืนได้เลยค่ะ 🙏`;
                } else if (refund < 0) {
                text += `\n⚠️ ยอดคงเหลือที่ต้องชำระเพิ่ม: ${formatNumber(Math.abs(refund))} บาท`;
                }

            } else {
                // 🔥 กรณีปกติ
                let summaryText = "";
                if (displayParts.length === 1) {
                summaryText = `${formatNumber(total)} บาท`;
                } else {
                summaryText = `${displayParts.join(" + ")} = ${formatNumber(total)} บาท`;
                }

                text = `ขออนุญาตแจ้งยอด${labelText}ค่ะ\n💳 ยอดชำระ ${summaryText}`;
            }

            text+= `\n\nธ.กสิกร(KBank)\nเลขที่บัญชี : 061-3-47929-5\nชื่อบัญชี : Pimvanat K.`

            // const output = `ขออนุญาตแจ้งยอด${labelText}ค่ะ\nยอดชำระ ${summaryText}\n\nธ.กสิกร(KBank)\nเลขที่บัญชี : 061-3-47929-5\nชื่อบัญชี : Pimvanat K.`;
            document.getElementById('feeOutput').textContent = text;
        });

        document.getElementById('feeCopy').addEventListener('click', async () => {
            const text = document.getElementById('feeOutput').textContent;
            const status = document.getElementById('feeStatus');

            try {
                await navigator.clipboard.writeText(text);
                status.textContent = 'Copied!';
                
                setTimeout(() => status.textContent = '', 1500);
            } catch (err) {
                status.textContent = 'Failed to copy';
            }
        });

        // Set sample values
        document.getElementById('priceFee').value = '350';
        document.getElementById('webFee').value = '0';
        document.getElementById('ticketFee').value = '0';
        document.getElementById('shippingFee').value = '0';
        // Auto generate on load
        document.getElementById('generateFeeForm').click();

        document.getElementById('thankYouCopy').addEventListener('click', async () => {
            const text = document.getElementById('thankYou').textContent;
            const status = document.getElementById('thankYouStatus');

            try {
                await navigator.clipboard.writeText(text);
                status.textContent = 'Copied!';
                
                setTimeout(() => status.textContent = '', 1500);
            } catch (err) {
                status.textContent = 'Failed to copy';
            }
        });
      });
